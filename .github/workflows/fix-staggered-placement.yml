name: Apply staggered placement fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-staggered-placement.yml'

permissions:
  contents: write

jobs:
  fix-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch placement collision
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    if (this.towers.some((tower) =>
      Math.abs(tower.body.x - placement.x) < PLANT_FRAME_SIZE - 1
      && Math.abs(tower.body.y - placement.y) < PLANT_FRAME_SIZE - 1,
    )) return { allowed: false, reason: "Cet emplacement est déjà occupé" };'''
          new = '''    const occupied = this.towers.some((tower) => {
      const deltaX = Math.abs(tower.body.x - placement.x);
      const deltaY = Math.abs(tower.body.y - placement.y);
      const axisTolerance = PLANT_HALF_STEP * 0.75;
      const fullSpacing = PLANT_FRAME_SIZE - 1;

      // Sur la grille au demi-pas, une plante ne peut pas être glissée à
      // moitié directement à droite/gauche ou au-dessus/dessous d'une autre.
      // En revanche, le demi-pas sur les DEUX axes forme le quinconce voulu :
      // les coins des cadres se croisent sans empêcher cette pose diagonale.
      const tooCloseOnSameColumn = deltaX < axisTolerance && deltaY < fullSpacing;
      const tooCloseOnSameRow = deltaY < axisTolerance && deltaX < fullSpacing;
      return tooCloseOnSameColumn || tooCloseOnSameRow;
    });
    if (occupied) return { allowed: false, reason: "Cet emplacement est déjà occupé" };'''
          if old not in text:
              raise SystemExit('Expected placement collision block not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - run: npm ci
      - run: npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-staggered-placement.yml
          git add src/main.ts
          git commit -m "fix: allow diagonal half-step plant placement"
          git push
